<!doctype html>
<html lang="he", dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="/register" method="post">

      <label for="fullName">שם מלא</label>
      <input type="text" name="fullName" id="fullName" required minlength="2" />
      <br />
      <label for="email">אימייל</label>
      <input type="email" name="email" id="email" required />

      <br />
      <label for="password">סיסמה</label>
      <input
        type="password"
        name="password"
        id="password"
        required
        minlength="8"
      />

      <br />
      <label for="age">גיל</label>
      <input type="number" name="age" id="age" min="13" max="120" />
      <br />
      <label for="management">מנהל</label>
      <input type="radio" name="role" id="management" value="management" />

      <br />
      <label for="user">משתמש</label>
      <input type="radio" name="role" id="user" value="user" />

      <br />
      <label for="agree">הסכמה לתנאים</label>
      <input type="checkbox" name="agree" id="agree" value="yes" required />

      <br />
      <button type="submit">שליחה</button>
    </form>
  </body>
</html>
